name: Build and deploy simulator

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simulator-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/lixionary/lixionary-simulator

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.publish.outputs.image_ref }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build x86 production image and run unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: lixionary-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start production container
        env:
          SIMULATOR_IMAGE: lixionary-simulator:ci
        run: docker compose up --detach --no-build --pull never --wait --wait-timeout 60
      - run: npx playwright install --with-deps chromium
      - name: Test all simulators against the production container
        env:
          BROWSER_BASE_URL: http://127.0.0.1:8590
        run: npm run test:browser
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          docker tag lixionary-simulator:ci "$IMAGE:sha-$GITHUB_SHA"
          docker tag lixionary-simulator:ci "$IMAGE:main"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:main"
          image_ref=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail 100
      - name: Stop test container
        if: always()
        run: docker compose down

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://simulation.lixionary.com
    env:
      DEPLOY_HOST: lixionary.com
      DEPLOY_USER: lixsu
      DEPLOY_PATH: /app/lixionary-simulator
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  BatchMode yes\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Upload deployment configuration
        run: |
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/deploy'"
          scp compose.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.yaml"
          scp deploy/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/deploy/deploy.sh"
      - name: Pull and start the tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          # shellcheck disable=SC2029
          printf '%s' "$GHCR_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash '$DEPLOY_PATH/deploy/deploy.sh' '$IMAGE_REF' '$GHCR_USER'"
      - name: Verify public HTTPS and all simulator pages
        run: |
          for path in / /4g-lte/ /apparent-annual-motion/ /error-detection/ /osi/ /cpu/ /game-of-life/; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 --max-time 20 \
              "https://simulation.lixionary.com$path" --output /dev/null
          done
      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
