name: lixionary-simulator

services:
  simulator:
    image: ${SIMULATOR_IMAGE:-lixionary-simulator:local}
    platform: linux/amd64
    build:
      context: .
    ports:
      - "127.0.0.1:8590:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
